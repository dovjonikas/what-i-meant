<!doctype html>
<!-- The second story, "Say Again". js/main.js starts it; the folder's README.md maps the
     files. The radio console, the chart, the notes and the words all live here; the
     picture is one canvas (js/stage.js) painted by js/art.js. -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Say Again · What I Meant</title>
    <meta name="description" content="Four night shifts on a coast radio. Someone on channel 16 only clicks.">
    <meta name="theme-color" content="#0a1220">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Say Again">
    <meta property="og:description" content="A story from What I Meant.">
    <meta property="og:url" content="https://dovjonikas.github.io/what-i-meant/stories/say-again/">
    <meta property="og:image" content="https://dovjonikas.github.io/what-i-meant/stories/say-again/cover.jpg">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="manifest" href="../../manifest.webmanifest">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="What I Meant">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" type="image/png" sizes="32x32" href="../../assets/icon-32.png">
    <link rel="apple-touch-icon" href="../../assets/icon-180.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Recursive:slnt,wght,CASL,CRSV,MONO@-15..0,300..1000,0..1,0..1,0..1&display=swap">
    <link rel="stylesheet" href="css/story.css">
    <link rel="stylesheet" href="../../css/install.css">
    <script type="module" src="js/main.js"></script>
  </head>
  <body class="is-gate">
    <canvas id="stage" aria-hidden="true"></canvas>
    <!-- Frosted glass beside the phone-wide column on bigger screens, as on the menu. -->
    <div class="glass" aria-hidden="true"></div>

    <main class="column">
      <header class="bar">
        <a class="back" href="../../" aria-label="Back to the stories">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
        <button class="sound" type="button" aria-pressed="true" aria-label="Sound">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 9.5h3.2L12 5.5v13l-4.8-4H4z" />
            <path class="waves" d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a7.8 7.8 0 0 1 0 11" />
            <path class="cross" d="M16 9.5l5 5M21 9.5l-5 5" />
          </svg>
        </button>
      </header>

      <!-- The radio on the desk (js/console.js). -->
      <section class="console" aria-label="Radio">
        <div class="c-top">
          <div class="c-ch" aria-live="polite"><span class="c-ch-label">CH</span><span class="c-ch-num">16</span></div>
          <button class="c-16" type="button" aria-label="Channel 16">16</button>
          <span class="c-lamp c-rx" aria-hidden="true"><i></i>RX</span>
          <span class="c-lamp c-tx" aria-hidden="true"><i></i>TX</span>
          <div class="c-df" aria-label="Direction finder"><span>DF</span><b class="c-df-val">---</b></div>
          <button class="c-notes" type="button" aria-label="Notes" hidden><span class="c-notes-n">0</span></button>
        </div>
        <div class="c-screen" aria-live="polite">
          <ol class="c-log"></ol>
          <div class="c-panel" hidden></div>
          <div class="c-choices"></div>
        </div>
        <div class="c-controls">
          <div class="c-knob" role="slider" tabindex="0" aria-label="Channel knob" aria-valuemin="1" aria-valuemax="88" aria-valuenow="16">
            <div class="c-knob-cap"></div>
          </div>
          <p class="c-hint"></p>
          <button class="c-ptt" type="button" aria-label="Push to talk">
            <svg class="c-ptt-ring" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" pathLength="100" /></svg>
            <span class="c-ptt-talk">HOLD<br>TO TALK</span>
            <span class="c-ptt-key">KEY</span>
          </button>
        </div>
      </section>

      <!-- Words under the picture when the story is away from the radio (js/ui.js). -->
      <div class="words" hidden>
        <p class="words-line"></p>
        <div class="words-picks"></div>
        <button class="hand-ptt" type="button" hidden>
          <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" pathLength="100" /></svg>
          <span class="hand-hint"></span>
        </button>
      </div>
    </main>

    <!-- A quiet "tap" after a line or a note has waited (js/ui.js); above the note and the words. -->
    <p class="words-go">tap to go on</p>

    <!-- The chart of the bay (js/chart.js). -->
    <div class="chart" hidden>
      <p class="chart-say"></p>
      <canvas aria-label="Chart of the bay"></canvas>
      <button class="chart-help btn is-quiet" type="button" hidden>Lay it for me</button>
    </div>

    <!-- Everything learned so far, on sticky notes (js/notes.js). -->
    <div class="notes" hidden>
      <div class="notes-sheet">
        <p class="notes-title">What you know</p>
        <ul class="notes-list"></ul>
        <button class="notes-close btn is-quiet" type="button">Back to the radio</button>
      </div>
    </div>

    <!-- A note left at home (js/ui.js). -->
    <div class="paper" hidden><p class="paper-text"></p></div>

    <!-- Night cards and the end (js/ui.js). -->
    <div class="card" hidden></div>

    <!-- The decoder and the key, copied into the screen when needed (js/console.js). -->
    <template id="tpl-decode">
      <p class="d-head">DECODE</p>
      <div class="d-word"></div>
      <p class="d-big"></p>
      <p class="d-tip"></p>
      <div class="d-pick"></div>
    </template>
    <template id="tpl-key">
      <p class="d-head">SEND</p>
      <div class="k-row"></div>
      <p class="k-tip"></p>
    </template>

    <!-- The start screen. Sound can only start from a tap. -->
    <div class="gate">
      <p class="gate-kicker">What I Meant · 02</p>
      <h1 class="gate-title">Say Again</h1>
      <p class="gate-note">Best with sound on.</p>
      <div class="gate-actions">
        <button class="btn gate-start" type="button">Start</button>
        <button class="btn is-quiet gate-over" type="button" hidden>Start over</button>
      </div>
    </div>

    <noscript><p class="noscript">This story needs JavaScript.</p></noscript>
  </body>
</html>
